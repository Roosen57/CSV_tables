  <script>
    window.data6 = [];
    window.data7 = [];

    async function loadCSV(url, variableName) {
      Papa.parse(url, {
        download: true,        // fetches the URL for you
        header: true,          // first row becomes object keys
        skipEmptyLines: true,
        dynamicTyping: true,   // "30" -> 30, "true" -> true
        complete: (results) => {
          window[variableName] = results.data; // array of objects
          console.log(window[variableName]);
        },
        error: (err) => {
          console.error('Failed to load CSV:', err);
        }
      });
    }

    loadCSV(
      'https://raw.githubusercontent.com/Roosen57/CSV_tables/refs/heads/main/7sep.csv',
      'data6'
    );

      'https://raw.githubusercontent.com/Roosen57/CSV_tables/refs/heads/main/8sep.csv',
      'data7'
    );
  </script>

setTimeout(() => {
  setInterval(function ( ) {
    if (!Array.isArray(window.data6) || !window.data6[4]) {
      return;
    }
    var index = 1 + Math.floor(((new Date()).getTime()- 1788757200000)/30000); //  + 3600000*3  - 3600000*3
    if (index > 962) {
      index = 962;
    } else if (index < 0) {
      index = 0;
    }
    for (var i = 0; i < chartT.series.length; i++) {
      const row = window.data6[index];
      const value = Object.values(row)[i+2];
      const y = Number(value);
      if (Number.isFinite(y)) {
        var x = (new Date()).getTime() + 3600000*3;
        if(chartT.series[i].data.length > 40) {
          chartT.series[i].addPoint([x, y], true, true, true);
        } else {
          chartT.series[i].addPoint([x, y], true, false, true);
        }
      }
    }
  }, 1000 ) ;
}, 1000);
